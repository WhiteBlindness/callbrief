[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callbrief"
version = "0.1.0"
description = "Avaliação preliminar, com fontes, de avisos de financiamento de I&D"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0,<7"]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
callbrief = "callbrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
